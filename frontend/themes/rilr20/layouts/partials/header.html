<header class="site-header">
    <nav class="site-nav">
        <a class="logo" href="{{.Site.BaseURL}}"></a>
        <ul>
            {{ $counter := 0 }}
            {{ range .Site.Menus.main }}
                {{$counter = add $counter 1}}
                <div class="div-{{$counter}}">
                    {{if eq (lower .Name) "github"}}
                        <a target="_blank" href="{{ .URL }}">{{.Name}}</a>
                    {{else }}
                        <a href="{{ .URL }}">{{.Name}}</a>

                    {{end}}
                </div>
            {{ end }}
        </ul>
    </nav>
</header>
