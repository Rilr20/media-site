services:
  web:
    build: ./frontend
    ports:
      - "41232:3000"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "41231:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production